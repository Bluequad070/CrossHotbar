# Builds the addon zip and uploads it to CurseForge (Forever) and GitHub Releases.
# Runs when a version tag like v1.0.2 is pushed, or when CHANGELOG.md on main gets
# a new top entry ("## v1.0.4"): then it tags that version itself and releases it.
name: Release

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the version
        id: ver
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          V=$(grep -m1 -oE '^## v[0-9]+(\.[0-9]+)*' CHANGELOG.md | sed 's/^## //' || true)
          if [ -z "$V" ]; then
            echo "No version heading in CHANGELOG.md, nothing to release."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then
            echo "$V is already released."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$V" -m "$V"
          git push origin "$V"
          echo "Tagged $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"

      # Build the zip and the GitHub release; CurseForge upload happens below (-c)
      - name: Package
        if: steps.ver.outputs.go == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -g 1.60.1 -c

      - name: Upload to CurseForge (Forever)
        if: steps.ver.outputs.go == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: "1803099"
        run: |
          set -euo pipefail
          ZIP=$(ls .release/*.zip | head -n 1)
          echo "Zip: $ZIP"

          status=$(curl -sS -o versions.json -w "%{http_code}" \
            -H "X-Api-Token: $CF_API_KEY" https://wow.curseforge.com/api/game/versions)
          echo "Game version list: HTTP $status"
          if [ "$status" != "200" ]; then
            head -c 400 versions.json; echo
            echo "::error::CurseForge rejected the request (HTTP $status). Check the CF_API_KEY secret."
            exit 1
          fi
          GV=$(jq '[.[] | select(.name == "1.60.1") | .id] | first' versions.json)
          if [ "$GV" = "null" ] || [ -z "$GV" ]; then GV=17053; fi
          echo "Forever game version id: $GV"

          jq -n --arg name "$VERSION" --rawfile cl CHANGELOG.md --argjson gv "$GV" \
            '{displayName: $name, releaseType: "release", changelog: $cl, changelogType: "markdown", gameVersions: [$gv]}' \
            > metadata.json

          status=$(curl -sS -o response.txt -w "%{http_code}" \
            -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=<metadata.json" -F "file=@$ZIP" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file")
          echo "Upload: HTTP $status"
          cat response.txt; echo
          [ "$status" = "200" ]
